<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silence Has Hands</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#8f1712;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  .landing{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    cursor:pointer;
  }

  .bg-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 30%;
    display:block;
  }

  .veil-top,
  .veil-bottom{
    position:absolute;
    left:0;
    right:0;
    pointer-events:none;
    z-index:1;
  }

  .veil-top{
    top:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(10,4,4,0.72) 0%, rgba(10,4,4,0.35) 60%, transparent 100%);
  }

  .veil-bottom{
    bottom:0;
    height:32%;
    background:linear-gradient(to top, rgba(10,4,4,0.78) 0%, rgba(10,4,4,0.3) 65%, transparent 100%);
  }

  .headline{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:2;
    padding:6vh 6vw 0;
    text-align:center;
  }

  .headline h1{
    margin:0 auto;
    max-width:920px;
    color:#ffffff;
    font-size:clamp(1.15rem, 3.4vw, 2.6rem);
    line-height:1.28;
    font-weight:800;
    letter-spacing:0.5px;
    text-transform:uppercase;
    text-shadow:0 3px 18px rgba(0,0,0,0.55);
  }

  .enter{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 20px 6vh;
  }

  .click-icon{
    width:52px;
    height:52px;
    margin-bottom:12px;
    animation:pulse 1.8s ease-in-out infinite;
  }

  .click-icon svg{
    width:100%;
    height:100%;
    display:block;
  }

  @keyframes pulse{
    0%, 100% { transform:scale(1); opacity:0.85; }
    50% { transform:scale(1.12); opacity:1; }
  }

  .enter p{
    margin:0;
    color:#ffffff;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,0.55);
  }

  .enter .rule{
    width:34px;
    height:2px;
    background:rgba(255,255,255,0.6);
    margin:14px 0 0;
  }

  @media (max-width:600px){
    .headline{ padding-top:5vh; }
    .headline h1{ font-size:clamp(1rem, 5.4vw, 1.6rem); }
    .click-icon{ width:42px; height:42px; }
    .enter p{ font-size:0.72rem; letter-spacing:2px; }
  }
</style>
</head>
<body>

  <div class="landing" id="landing">
    <img class="bg-image" src="bg.jpg" alt="Hands holding a person wrapped in fragments of unsent words">

    <div class="veil-top"></div>
    <div class="veil-bottom"></div>

    <div class="headline">
      <h1>Write and get rid of the hands that are holding you back.</h1>
    </div>

    <div class="enter">
      <div class="click-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M27 6v22M27 6l-6 6M27 6l6 6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
          <path d="M20 30c0-2 1.6-3.6 3.6-3.6s3.6 1.6 3.6 3.6v-4c0-2 1.6-3.6 3.6-3.6s3.6 1.6 3.6 3.6v3c0-2 1.6-3.6 3.6-3.6s3.6 1.6 3.6 3.6v5c0-1.8 1.5-3.2 3.3-3.2 1.9 0 3.4 1.5 3.4 3.4v9.2c0 6.6-5.4 12-12 12h-3.4c-4 0-7.8-2-10-5.3l-5.6-8.4c-1.1-1.7-.7-4 1-5.2 1.6-1.1 3.8-.8 5 .6l2.3 2.7V30z" fill="#ffffff" opacity="0.92"/>
        </svg>
      </div>
      <p>Click to write.</p>
      <div class="rule"></div>
    </div>
  </div>

<script>
  document.getElementById('landing').addEventListener('click', function () {
    window.location.href = 'write.html';
  });
</script>

</body>
</html>
